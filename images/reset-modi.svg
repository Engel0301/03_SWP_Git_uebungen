<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Vergleich der Git-Reset-Modi</title><desc id="desc">Soft, mixed und hard verändern Branch-Zeiger, Staging Area und Arbeitsverzeichnis unterschiedlich.</desc><style>text{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:27px;font-weight:700}.th{font-size:20px;font-weight:700}.t{font-size:18px}.yes{fill:#25733a;font-weight:700}.no{fill:#b13c2e;font-weight:700}</style><rect width="1100" height="540" rx="18" fill="#f7f9fc"/><text x="550" y="44" text-anchor="middle" class="h">Was verändert git reset?</text>
<g stroke="#9aa9b8" stroke-width="2" fill="none"><rect x="60" y="80" width="980" height="365" rx="8"/><line x1="60" y1="155" x2="1040" y2="155"/><line x1="60" y1="250" x2="1040" y2="250"/><line x1="60" y1="345" x2="1040" y2="345"/><line x1="310" y1="80" x2="310" y2="445"/><line x1="535" y1="80" x2="535" y2="445"/><line x1="760" y1="80" x2="760" y2="445"/></g>
<text x="185" y="125" text-anchor="middle" class="th">Modus</text><text x="422" y="112" text-anchor="middle" class="th">Branch / HEAD</text><text x="422" y="137" text-anchor="middle" class="t">verschoben?</text><text x="647" y="112" text-anchor="middle" class="th">Staging Area</text><text x="647" y="137" text-anchor="middle" class="t">zurückgesetzt?</text><text x="900" y="112" text-anchor="middle" class="th">Arbeitsverzeichnis</text><text x="900" y="137" text-anchor="middle" class="t">zurückgesetzt?</text>
<text x="185" y="207" text-anchor="middle" class="th">--soft</text><text x="422" y="207" text-anchor="middle" class="yes">JA</text><text x="647" y="207" text-anchor="middle" class="no">NEIN</text><text x="900" y="207" text-anchor="middle" class="no">NEIN</text>
<text x="185" y="302" text-anchor="middle" class="th">--mixed</text><text x="422" y="302" text-anchor="middle" class="yes">JA</text><text x="647" y="302" text-anchor="middle" class="yes">JA</text><text x="900" y="302" text-anchor="middle" class="no">NEIN</text>
<text x="185" y="397" text-anchor="middle" class="th">--hard</text><text x="422" y="397" text-anchor="middle" class="yes">JA</text><text x="647" y="397" text-anchor="middle" class="yes">JA</text><text x="900" y="397" text-anchor="middle" class="yes">JA</text>
<text x="550" y="485" text-anchor="middle" class="th" fill="#b13c2e">Achtung: --hard verwirft Änderungen an verfolgten Dateien.</text><text x="550" y="520" text-anchor="middle" class="t">Vorher immer git status prüfen und wichtige Arbeit sichern.</text>
</svg>
