<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Empfohlener Git-Arbeitsablauf</title><desc id="desc">Status prüfen, bearbeiten, Unterschied prüfen, stagen, kontrollieren und committen.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f88"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.h{font-size:27px;font-weight:700}.t{font-size:17px;font-weight:700}.c{font-family:monospace;font-size:16px}</style></defs><rect width="1100" height="300" rx="18" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" class="h">Sicherer Arbeitszyklus</text>
<g fill="#fff" stroke="#3973ac" stroke-width="3"><rect x="35" y="100" width="145" height="95" rx="14"/><rect x="210" y="100" width="145" height="95" rx="14"/><rect x="385" y="100" width="145" height="95" rx="14"/><rect x="560" y="100" width="145" height="95" rx="14"/><rect x="735" y="100" width="145" height="95" rx="14"/><rect x="910" y="100" width="155" height="95" rx="14"/></g><g stroke="#315f88" stroke-width="4" marker-end="url(#a)"><line x1="180" y1="148" x2="200" y2="148"/><line x1="355" y1="148" x2="375" y2="148"/><line x1="530" y1="148" x2="550" y2="148"/><line x1="705" y1="148" x2="725" y2="148"/><line x1="880" y1="148" x2="900" y2="148"/></g>
<text x="107" y="132" text-anchor="middle" class="t">Prüfen</text><text x="107" y="166" text-anchor="middle" class="c">git status</text><text x="282" y="132" text-anchor="middle" class="t">Bearbeiten</text><text x="282" y="166" text-anchor="middle" class="c">Editor</text><text x="457" y="132" text-anchor="middle" class="t">Vergleichen</text><text x="457" y="166" text-anchor="middle" class="c">git diff</text><text x="632" y="132" text-anchor="middle" class="t">Vormerken</text><text x="632" y="166" text-anchor="middle" class="c">git add</text><text x="807" y="132" text-anchor="middle" class="t">Kontrollieren</text><text x="807" y="166" text-anchor="middle" class="c">diff --cached</text><text x="987" y="132" text-anchor="middle" class="t">Speichern</text><text x="987" y="166" text-anchor="middle" class="c">git commit</text><path d="M990 205 C990 270 110 270 110 205" fill="none" stroke="#315f88" stroke-width="3" marker-end="url(#a)"/><text x="550" y="278" text-anchor="middle" class="t">Nächste kleine Änderung</text>
