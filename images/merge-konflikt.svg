<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Aufbau eines Merge-Konflikts</title><desc id="desc">Konfliktmarkierungen zeigen die aktuelle und die eingehende Änderung.</desc><style>text{font-family:Arial,sans-serif;fill:#19334d}.h{font-size:27px;font-weight:700}.t{font-size:19px}.code{font-family:monospace;font-size:20px}</style><rect width="1100" height="470" rx="18" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" class="h">Merge-Konflikt in einer Textdatei</text>
<rect x="70" y="80" width="610" height="330" rx="12" fill="#172433"/><text x="100" y="125" class="code" fill="#f2f5f8">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><text x="100" y="168" class="code" fill="#ffd27a">Änderung des aktuellen Branches</text><text x="100" y="213" class="code" fill="#f2f5f8">=======</text><text x="100" y="258" class="code" fill="#d8bbff">Änderung des eingehenden Branches</text><text x="100" y="303" class="code" fill="#f2f5f8">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-javascript</text><text x="100" y="365" class="code" fill="#9ee0ad">→ Inhalt sinnvoll zusammenführen</text>
<line x1="705" y1="120" x2="870" y2="120" stroke="#d08a00" stroke-width="3"/><text x="895" y="126" class="t">aktuelle Version</text><line x1="705" y1="215" x2="870" y2="215" stroke="#718096" stroke-width="3"/><text x="895" y="221" class="t">Trennlinie</text><line x1="705" y1="300" x2="870" y2="300" stroke="#7149a5" stroke-width="3"/><text x="895" y="306" class="t">eingehende Version</text><text x="810" y="380" class="t">Danach:</text><text x="810" y="414" class="code" fill="#8b2f19">git add DATEI</text><text x="810" y="447" class="code" fill="#8b2f19">git commit</text>
</svg>
